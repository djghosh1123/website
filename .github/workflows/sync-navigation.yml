name: Sync site navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_navigation.py"
      - ".github/workflows/sync-navigation.yml"
      - "nav-more.css"
      - "more/**"

permissions:
  contents: write

jobs:
  sync-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize site navigation
        run: python scripts/sync_navigation.py

      - name: Commit navigation changes
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Use three-dot dropdown for More navigation"
          git push
