name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-citations.yml"
      - "scripts/update_citations.py"

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Google Scholar citation counts
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_citations.py

      - name: Commit updated citation counts
        run: |
          if git diff --quiet -- publications.html; then
            echo "Citation counts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html
          git commit -m "Update Google Scholar citation counts"
          git push
